[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailrisk"
version = "0.1.0"
description = "Deterministic foundation for conditional tail-risk forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "arch>=8"]
# Optional: exchange-session cross-check for the market-data adapter. `ingest` runs
# without it and records the check as skipped rather than guessing a calendar.
data = ["pandas_market_calendars>=5"]

[project.scripts]
tailrisk = "tailrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "integration: end-to-end smoke test",
]
