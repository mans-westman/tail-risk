[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailrisk"
version = "0.1.0"
description = "Deterministic foundation for conditional tail-risk forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "arch>=8"]
# Optional: exchange-session cross-check for the market-data adapter. `ingest` runs
# without it and records the check as skipped rather than guessing a calendar.
data = ["pandas_market_calendars>=5"]
# Optional: alpha-conditioned joint MLP (`tailrisk.models.joint_mlp` core and the
# `tailrisk.models.joint_mlp_training` trainer). Exercised on jax/jaxlib 0.12.0.1 with
# optax 0.2.8, CPU, x64 enabled by the tests. Conventional models and the CLI never import
# either module, so the package still installs and runs without this extra. The JAX lower
# bound is the version whose `jax.random.split`/`fold_in` and float64 policy the tests
# exercise; optax is bounded to the 0.2 series the clip-then-Adam chain was verified on.
neural = ["jax>=0.4.30", "optax>=0.2,<0.3"]

[project.scripts]
tailrisk = "tailrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "integration: end-to-end smoke test",
]
