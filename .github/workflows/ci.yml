name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the tested interpreter (docs/ENVIRONMENT.md). 3.10 is the declared
        # lower bound of requires-python; this job is what checks that declaration.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install without the neural extra
        run: python -m pip install -e '.[baselines,plots,dev]'
      - name: Run the non-neural suite
        run: python -m pytest -q

  neural:
    name: neural tests (Python 3.13)
    runs-on: ubuntu-24.04
    env:
      # The MLP path requires float64, as the saved checkpoints do.
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the neural extra
        run: python -m pip install -e '.[baselines,plots,dev,neural]'
      - name: Run the neural modules
        run: >-
          python -m pytest -q
          tests/test_joint_mlp.py
          tests/test_joint_mlp_training.py
          tests/test_mlp_integration.py
          tests/test_adapter_parity.py

  smoke:
    name: offline run -> verify -> evaluate -> report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[baselines,plots]'
      - name: Run the documented synthetic example
        env:
          RUN_DIR: ${{ runner.temp }}/quickstart
        run: |
          set -euo pipefail
          python -m tailrisk run      --config configs/examples/student_t.json --output "$RUN_DIR"
          python -m tailrisk verify   --run "$RUN_DIR"
          python -m tailrisk evaluate --run "$RUN_DIR"
          python -m tailrisk report   --run "$RUN_DIR" --plots
      - name: Check documented counts and coverage
        env:
          RUN_DIR: ${{ runner.temp }}/quickstart
        run: |
          python - "$RUN_DIR" <<'PY'
          import csv, json, pathlib, sys

          run = pathlib.Path(sys.argv[1])
          with (run / "forecasts.csv").open() as f:
              forecasts = sum(1 for _ in csv.DictReader(f))
          with (run / "metrics.csv").open() as f:
              metrics = sum(1 for _ in csv.DictReader(f))
          coverage = json.loads((run / "verification_coverage.json").read_text())
          counts = coverage["counts"]
          plots = sorted((run / "plots").glob("*.png"))

          assert forecasts == 41232, f"expected 41,232 forecast rows, got {forecasts}"
          assert metrics == 24, f"expected 24 metric rows, got {metrics}"
          assert counts["passed"] == 27, counts
          assert counts["failed"] == 0 and counts["unavailable"] == 0, counts
          assert coverage["partial"] is False, coverage["partial"]
          assert len(plots) == 3, [p.name for p in plots]
          assert (run / "report.md").is_file() and (run / "report.json").is_file()
          print(f"41,232 rows; {counts['passed']}/27 checks; 24 metric rows; 3 figures")
          PY

  docs:
    name: public links and skill parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the packages the packaging tests import
        run: python -m pip install numpy scipy pytest
      - name: Skill reference copies match docs/
        run: python skills/tail-risk-audit/check_references.py
      - name: Relative links resolve and no public page names a private file
        run: python -m pytest -q tests/test_public_package.py

  reproducible:
    name: pinned tested environment
    runs-on: ubuntu-24.04
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The tested interpreter is CPython 3.13.15 (docs/ENVIRONMENT.md); the
          # 3.13 series is what a hosted runner supplies.
          python-version: "3.13"
      - name: Install the exact tested versions
        run: |
          python -m pip install -r requirements-tested.txt
          python -m pip install -e . --no-deps
      - name: Show the resolved versions
        run: python -m pip freeze
      - name: Run the full suite
        run: python -m pytest -q
